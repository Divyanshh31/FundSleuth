<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | FundSleuth AI Portfolio Intelligence</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS & FontAwesome 6 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Design System -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="auth-body">

    <!-- Noise Overlay -->
    <div class="noise-overlay" aria-hidden="true"></div>

    <!-- WebGL Background -->
    <canvas id="hero-canvas"></canvas>

    <div class="container-fluid min-vh-100 p-0 d-flex flex-column justify-content-between position-relative" style="z-index: 10;">
        
        <!-- Top Floating Minimal Nav -->
        <nav class="navbar navbar-custom px-4 py-2 mt-3 mx-auto w-100" style="max-width: 1200px;">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <div class="brand-icon-box p-2 rounded-3 text-white">
                        <i class="fa-solid fa-chart-pie fs-5"></i>
                    </div>
                    <span class="fs-4 fw-extrabold gradient-text">FundSleuth</span>
                    <span class="badge bg-dark text-white rounded-pill px-3 py-1 font-mono small">v2.0 AI</span>
                </a>
                
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-taste-soft btn-sm px-3 rounded-pill d-flex align-items-center gap-1" onclick="toggleTheme()" id="themeToggleBtn">
                        <i class="fa-solid fa-moon" id="themeToggleIcon"></i> <span id="themeToggleText">Dark</span>
                    </button>
                    <a href="login.html" class="btn btn-taste-soft btn-sm px-3 rounded-pill">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </nav>

        <!-- Main Auth Container Split Screen -->
        <main class="container my-auto py-4">
            <div class="row align-items-center justify-content-center">
                <div class="col-md-7 col-lg-5">
                    <div class="card card-custom p-4 p-md-5 shadow-lg">
                        <div class="text-center mb-4">
                            <div class="brand-icon-box p-3 d-inline-flex rounded-4 text-white mb-3 shadow">
                                <i class="fa-solid fa-key fs-3"></i>
                            </div>
                            <h3 class="fw-bold text-dark mb-1">Reset your password</h3>
                            <p class="text-secondary small">Enter your registered email address and we'll send you a password reset link.</p>
                        </div>

                        <!-- Alert Container -->
                        <div id="authAlert" class="alert d-none py-2 px-3 small rounded-3 mb-3" role="alert"></div>

                        <!-- Forgot Password Form -->
                        <form id="forgotForm" onsubmit="handleForgotSubmit(event)" novalidate>
                            <div class="mb-4">
                                <label for="emailInput" class="form-label text-dark fw-semibold small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
                                    <input type="email" class="form-control bg-light border-start-0 ps-0 text-dark" id="emailInput" placeholder="name@example.com" required autocomplete="email">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-taste-primary btn-lg w-100 py-3 mb-3 fw-bold" id="submitBtn">
                                <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
                                <span id="btnText">Send Reset Link</span>
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="login.html" class="fw-bold text-secondary text-decoration-none small">
                                <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center py-3 text-secondary small bg-transparent">
            <p class="m-0">© 2026 FundSleuth — Client-Side Financial Intelligence.</p>
        </footer>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/canvas-bg.js"></script>
    <script src="/js/auth.js"></script>

    <script>
        async function handleForgotSubmit(e) {
            e.preventDefault();
            const alertEl = document.getElementById('authAlert');
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');

            const email = document.getElementById('emailInput').value;

            alertEl.className = 'alert d-none py-2 px-3 small rounded-3 mb-3';

            submitBtn.disabled = true;
            btnSpinner.classList.remove('d-none');
            btnText.innerText = 'Sending Link...';

            try {
                await AuthManager.forgotPassword(email);
                alertEl.className = 'alert alert-success py-3 px-3 small rounded-3 mb-3';
                alertEl.innerHTML = `
                    <div class="d-flex align-items-start gap-2">
                        <i class="fa-solid fa-circle-check fs-5 text-success"></i>
                        <div>
                            <strong>Reset link sent!</strong><br>
                            If an account exists for <u>${email}</u>, check your inbox for instructions to reset your password.
                        </div>
                    </div>
                `;
                submitBtn.disabled = false;
                btnSpinner.classList.add('d-none');
                btnText.innerText = 'Resend Reset Link';
            } catch (err) {
                alertEl.className = 'alert alert-danger py-2 px-3 small rounded-3 mb-3';
                alertEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation me-1"></i> ${err.message}`;
                submitBtn.disabled = false;
                btnSpinner.classList.add('d-none');
                btnText.innerText = 'Send Reset Link';
            }
        }
    </script>
</body>
</html>
